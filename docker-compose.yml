# Home-server deployment: no Traefik, no path-routed domain. This box is
# reached over Tailscale Serve/Funnel instead — see the `tailscale serve`
# section below and MINIO_PUBLIC_URL in .env.
#
# Public shape (once `tailscale funnel` is set up as described below):
#   https://<your-tailnet-hostname>/       -> api   (all paths)
#   https://<your-tailnet-hostname>/media  -> minio (one path mapping)
#
# All three services publish only to 127.0.0.1 — nothing here is reachable
# on the LAN directly. Tailscale Serve is what proxies from 127.0.0.1 to
# the tailnet, and Funnel is what additionally exposes that to the public
# internet (needed since the Next.js frontend on Vercel isn't itself on
# your tailnet). One-time setup on the host, after `docker compose up -d`:
#
#   sudo tailscale set --operator=$USER   # avoids needing sudo below
#   tailscale serve --bg --set-path=/media http://127.0.0.1:9000
#   tailscale funnel --bg 8080
#
# `--set-path=/media`, not the actual MINIO_BUCKET name: Tailscale Serve
# STRIPS the mount path before forwarding (unlike a Traefik PathPrefix,
# which wouldn't) — a request for {MINIO_PUBLIC_URL}/{bucket}/{key} needs
# "/media" to survive as an extra segment ahead of the real bucket/key, so
# that after Tailscale strips it, MinIO still sees "/{bucket}/{key}". This
# is also why MINIO_PUBLIC_URL in .env must end in "/media" and not just be
# the bare hostname — see that var's comment in .env.example.
#
# IMPORTANT: every `tailscale serve`/`tailscale funnel` call re-derives the
# full path config and silently drops Funnel back to tailnet-only if you
# only re-run `serve` — always re-run `tailscale funnel --bg 8080`
# afterward to confirm `tailscale funnel status` still shows "Funnel on".

services:
  db:
    image: postgres:16
    container_name: portfolio_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./db:/var/lib/postgresql/data
    networks:
      - portfolio_internal

  minio:
    image: minio/minio:latest
    # Hyphenated, not underscored — the minio-go SDK validates its
    # endpoint against strict RFC-1123 hostname rules and rejects
    # underscores outright ("invalid hostname"), even though Docker's own
    # DNS resolves underscored container names just fine.
    container_name: portfolio-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - ./minio-data:/data
    ports:
      # 127.0.0.1 only — this is what `tailscale serve --set-path=/media
      # http://127.0.0.1:9000` proxies to. Not for direct LAN access; the
      # admin console (:9001) isn't published at all — reach it with
      # `docker compose exec minio ...` or an SSH tunnel if you need it.
      - "127.0.0.1:9000:9000"
    networks:
      - portfolio_internal

  api:
    build: ./server
    container_name: portfolio_api
    restart: unless-stopped
    depends_on:
      - db
      - minio
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      MINIO_ENDPOINT: portfolio-minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_USE_SSL: "false"
      # Full public URL, tailscale-hostname + "/media" — see the note up
      # top on why the path can't just be the bucket name. Set directly in
      # .env, not derived from a domain var (there's no Traefik host rule
      # to derive it from here).
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      # See .env.example's "yt-dlp cookies" section for how to generate
      # this file. It must exist before `docker compose up` — Docker
      # bind-mounts a missing host file as an empty *directory* instead,
      # which breaks yt-dlp outright — so `touch yt-dlp-cookies.txt` first
      # if you don't have a real one yet (an empty file just means
      # favorite-track processing runs without cookies, and will likely
      # hit YouTube's bot check).
      YT_DLP_COOKIES_PATH: /cookies.txt
    volumes:
      # Read-write, not :ro — yt-dlp writes refreshed cookies/expiry back
      # to this file after each run to keep the session current, not just
      # reads it. Read-only makes every request fail outright (OSError:
      # Read-only file system).
      - ./yt-dlp-cookies.txt:/cookies.txt
    ports:
      # 127.0.0.1 only — `tailscale funnel --bg 8080` is what makes this
      # reachable from the tailnet/internet; it isn't meant to answer
      # directly on the LAN.
      - "127.0.0.1:8080:8080"
    networks:
      - portfolio_internal

networks:
  portfolio_internal:
    driver: bridge
